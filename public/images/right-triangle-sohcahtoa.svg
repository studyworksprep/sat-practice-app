<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Right triangle sides relative to an acute angle</title>
  <desc id="desc">A right triangle has theta at the lower-right vertex. The slanted side across from the right angle is labeled hypotenuse, the vertical side across from theta is labeled opposite, and the bottom leg next to theta is labeled adjacent.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#101828" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="600" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#101828">Name every side from the marked angle</text>

    <path d="M170 495 L810 495 L170 145 Z" fill="#ffffff" stroke="#102a43" stroke-width="8" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="M170 495 L170 452 L213 452 L213 495" fill="none" stroke="#c4320a" stroke-width="7"/>
    <text x="118" y="484" font-size="25" font-weight="700" fill="#c4320a">90°</text>

    <path d="M744 495 A66 66 0 0 0 752 461" fill="none" stroke="#067647" stroke-width="7"/>
    <text x="718" y="450" font-size="34" font-weight="700" font-style="italic" fill="#067647">θ</text>

    <rect x="26" y="265" width="178" height="64" rx="16" fill="#fff4ed" stroke="#f79009" stroke-width="3"/>
    <text x="115" y="306" text-anchor="middle" font-size="27" font-weight="700" fill="#b54708">OPPOSITE</text>
    <text x="218" y="303" font-size="22" fill="#b54708">across from θ</text>

    <rect x="407" y="495" width="190" height="64" rx="16" fill="#eff8ff" stroke="#2e90fa" stroke-width="3"/>
    <text x="502" y="536" text-anchor="middle" font-size="27" font-weight="700" fill="#175cd3">ADJACENT</text>
    <text x="605" y="536" font-size="22" fill="#175cd3">next to θ</text>

    <rect x="430" y="214" width="220" height="64" rx="16" fill="#f4f3ff" stroke="#7f56d9" stroke-width="3" transform="rotate(28.7 540 246)"/>
    <text x="540" y="255" text-anchor="middle" font-size="27" font-weight="700" fill="#6941c6" transform="rotate(28.7 540 246)">HYPOTENUSE</text>
    <text x="714" y="315" font-size="22" fill="#6941c6" transform="rotate(28.7 714 315)">across from 90°</text>

    <circle cx="810" cy="495" r="9" fill="#067647"/>
    <circle cx="170" cy="495" r="9" fill="#c4320a"/>
    <circle cx="170" cy="145" r="9" fill="#102a43"/>
  </g>
</svg>
