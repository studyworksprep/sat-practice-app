<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="title desc">
  <title id="title">The problem this lesson builds toward</title>
  <desc id="desc">The equation: the square root of x minus 4, plus the square root of x plus 1, equals 5.</desc>
  <rect width="640" height="170" rx="20" fill="#f8fafc" />
  <rect x="24" y="22" width="592" height="126" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#2d70b3">THE PROBLEM WE'RE BUILDING TOWARD</text>
  <g font-family="Arial, sans-serif" font-size="40" fill="#111827" transform="translate(30 0)">
    <!-- first radical: sqrt(x - 4) -->
    <path d="M86 108 L96 102 L108 126 L124 76 H226" fill="none" stroke="#111827" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
    <text x="132" y="118">x − 4</text>
    <text x="240" y="118">+</text>
    <!-- second radical: sqrt(x + 1) -->
    <path d="M276 108 L286 102 L298 126 L314 76 H418" fill="none" stroke="#111827" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
    <text x="322" y="118">x + 1</text>
    <text x="436" y="118">= 5</text>
  </g>
</svg>
