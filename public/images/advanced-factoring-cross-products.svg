<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">Cross-products in a non-monic trinomial</title>
  <desc id="desc">An area model for the product ax plus b times cx plus d, divided into regions ac x squared, ad x, bc x, and bd.</desc>
  <rect width="960" height="590" fill="#f8fafc"/>
  <text x="480" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172554">The middle term comes from two cross-products</text>

  <g transform="translate(185 132)">
    <rect x="0" y="0" width="520" height="320" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="5"/>
    <rect x="0" y="0" width="330" height="205" fill="#dbeafe"/>
    <rect x="330" y="0" width="190" height="205" fill="#e0e7ff"/>
    <rect x="0" y="205" width="330" height="115" fill="#dcfce7"/>
    <rect x="330" y="205" width="190" height="115" fill="#fef3c7"/>
    <line x1="330" y1="0" x2="330" y2="320" stroke="#1e3a8a" stroke-width="4"/>
    <line x1="0" y1="205" x2="520" y2="205" stroke="#1e3a8a" stroke-width="4"/>

    <text x="165" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172554">cx</text>
    <text x="425" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172554">d</text>
    <text x="-34" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172554">ax</text>
    <text x="-34" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172554">b</text>

    <text x="165" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1e3a8a">acx²</text>
    <text x="425" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#3730a3">adx</text>
    <text x="165" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#166534">bcx</text>
    <text x="425" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#92400e">bd</text>

    <path d="M 0 348 L 0 370 L 520 370 L 520 348" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="260" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#334155">cx + d</text>
    <path d="M 548 0 L 570 0 L 570 320 L 548 320" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="614" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#334155" transform="rotate(90 614 168)">ax + b</text>
  </g>

  <text x="480" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172554">(ax + b)(cx + d) = acx² + (ad + bc)x + bd</text>
</svg>
