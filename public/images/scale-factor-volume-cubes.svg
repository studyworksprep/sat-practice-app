<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">A scale factor of two makes the volume eight times as large</title>
  <desc id="desc">A cube with edge length 1 and volume 1 is compared with a similar cube with edge length 2 and volume 8. Length, width, and height are each multiplied by 2, so volume is multiplied by 2 times 2 times 2, or 8.</desc>
  <defs>
    <marker id="arrow" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L26,13 L0,26 Z" fill="#7a5af8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="200" y="62" text-anchor="middle" font-size="28" font-weight="700">Original cube</text>
    <text x="850" y="62" text-anchor="middle" font-size="28" font-weight="700">Similar cube</text>

    <g filter="url(#shadow)">
      <polygon points="120,190 190,145 300,145 230,190" fill="#e9d7fe" stroke="#6941c6" stroke-width="4"/>
      <polygon points="230,190 300,145 300,255 230,300" fill="#d6bbfb" stroke="#6941c6" stroke-width="4"/>
      <rect x="120" y="190" width="110" height="110" fill="#f4ebff" stroke="#6941c6" stroke-width="4"/>
    </g>
    <text x="210" y="338" text-anchor="middle" font-size="23">edge = 1</text>
    <text x="210" y="376" text-anchor="middle" font-size="25" font-weight="700" fill="#6941c6">volume = 1</text>

    <line x1="360" y1="230" x2="520" y2="230" stroke="#7a5af8" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="440" y="201" text-anchor="middle" font-size="28" font-weight="700" fill="#6941c6">each edge × 2</text>

    <g filter="url(#shadow)">
      <polygon points="680,155 800,80 1020,80 900,155" fill="#d1fadf" stroke="#067647" stroke-width="4"/>
      <polygon points="900,155 1020,80 1020,300 900,375" fill="#a6f4c5" stroke="#067647" stroke-width="4"/>
      <rect x="680" y="155" width="220" height="220" fill="#ecfdf3" stroke="#067647" stroke-width="4"/>
      <line x1="790" y1="155" x2="790" y2="375" stroke="#32d583" stroke-width="3"/>
      <line x1="680" y1="265" x2="900" y2="265" stroke="#32d583" stroke-width="3"/>
      <line x1="740" y1="117.5" x2="960" y2="117.5" stroke="#32d583" stroke-width="3"/>
      <line x1="790" y1="155" x2="910" y2="80" stroke="#32d583" stroke-width="3"/>
      <line x1="900" y1="265" x2="1020" y2="190" stroke="#32d583" stroke-width="3"/>
      <line x1="960" y1="117.5" x2="960" y2="337.5" stroke="#32d583" stroke-width="3"/>
    </g>
    <text x="850" y="416" text-anchor="middle" font-size="23">edge = 2</text>
    <text x="850" y="454" text-anchor="middle" font-size="25" font-weight="700" fill="#067647">volume = 8</text>

    <rect x="300" y="322" width="360" height="112" rx="16" fill="#f4f3ff" stroke="#bdb4fe" stroke-width="2"/>
    <text x="480" y="362" text-anchor="middle" font-size="21" font-weight="700" fill="#5925dc">Volume uses three dimensions</text>
    <text x="480" y="400" text-anchor="middle" font-size="27" fill="#5925dc">2 × 2 × 2 = 2³ = 8</text>
  </g>
</svg>
