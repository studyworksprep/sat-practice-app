<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">The digital SAT answer eliminator</title>
  <desc id="desc">A test question with four answer choices. A button marked ABC with a line through it sits at the top right of the question header; turning it on puts a small crossed-out letter beside every answer choice. In this example the second choice has been crossed out, so its text is struck through and dimmed, while the other three remain available.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="28" fill="#f6f8fb"/>

  <!-- Question card -->
  <rect x="34" y="34" width="626" height="452" rx="16" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>

  <!-- Header strip: question number, Mark for Review, eliminator toggle -->
  <path d="M34 50 a16 16 0 0 1 16-16 h594 a16 16 0 0 1 16 16 v46 h-626 z" fill="#f0f2f5"/>
  <rect x="50" y="47" width="34" height="34" rx="4" fill="#101828"/>
  <text x="67" y="71" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <path d="M100 51 h18 v26 l-9 -7 -9 7 z" fill="none" stroke="#344054" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="128" y="71" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#344054">Mark for Review</text>

  <!-- The eliminator toggle, shown active -->
  <rect x="592" y="45" width="52" height="38" rx="7" fill="#2f56d9"/>
  <text x="618" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ABC</text>
  <line x1="600" y1="78" x2="636" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="50" y1="104" x2="644" y2="104" stroke="#98a2b3" stroke-width="2.5" stroke-dasharray="14 9"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#101828">
    <text x="50" y="140" font-size="18">Which choice completes the text with the most</text>
    <text x="50" y="166" font-size="18">logical and precise word or phrase?</text>

    <!-- A — available -->
    <rect x="50" y="190" width="512" height="56" rx="12" fill="#ffffff" stroke="#344054" stroke-width="2"/>
    <circle cx="84" cy="218" r="16" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="84" y="225" font-size="16" text-anchor="middle">A</text>
    <text x="118" y="225" font-size="20">unadorned</text>

    <!-- B — crossed out: this is what the tool does -->
    <rect x="50" y="258" width="512" height="56" rx="12" fill="#f2f4f7" stroke="#98a2b3" stroke-width="2"/>
    <circle cx="84" cy="286" r="16" fill="none" stroke="#98a2b3" stroke-width="2"/>
    <text x="84" y="293" font-size="16" text-anchor="middle" fill="#98a2b3">B</text>
    <text x="118" y="293" font-size="20" fill="#98a2b3">sumptuous</text>
    <line x1="113" y1="286" x2="213" y2="286" stroke="#475467" stroke-width="2.5"/>

    <!-- C — available -->
    <rect x="50" y="326" width="512" height="56" rx="12" fill="#ffffff" stroke="#344054" stroke-width="2"/>
    <circle cx="84" cy="354" r="16" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="84" y="361" font-size="16" text-anchor="middle">C</text>
    <text x="118" y="361" font-size="20">erratic</text>

    <!-- D — available -->
    <rect x="50" y="394" width="512" height="56" rx="12" fill="#ffffff" stroke="#344054" stroke-width="2"/>
    <circle cx="84" cy="422" r="16" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="84" y="429" font-size="16" text-anchor="middle">D</text>
    <text x="118" y="429" font-size="20">dubious</text>
  </g>

  <!-- Per-choice cross-out controls, which appear once the tool is on -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="middle">
    <circle cx="606" cy="218" r="15" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="606" y="224" fill="#344054">A</text>
    <line x1="592" y1="218" x2="620" y2="218" stroke="#344054" stroke-width="2"/>

    <circle cx="606" cy="286" r="15" fill="#344054"/>
    <text x="606" y="292" fill="#ffffff">B</text>
    <line x1="592" y1="286" x2="620" y2="286" stroke="#ffffff" stroke-width="2"/>

    <circle cx="606" cy="354" r="15" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="606" y="360" fill="#344054">C</text>
    <line x1="592" y1="354" x2="620" y2="354" stroke="#344054" stroke-width="2"/>

    <circle cx="606" cy="422" r="15" fill="none" stroke="#344054" stroke-width="2"/>
    <text x="606" y="428" fill="#344054">D</text>
    <line x1="592" y1="422" x2="620" y2="422" stroke="#344054" stroke-width="2"/>
  </g>

  <!-- Callouts -->
  <path d="M742 96 C712 84, 684 70, 660 64" fill="none" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M742 268 C712 274, 680 282, 636 286" fill="none" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="700" y="128" font-size="22" font-weight="700">1. Turn it on</text>
    <text x="700" y="154" font-size="17" fill="#344054">the ABC button, top right</text>

    <text x="700" y="316" font-size="22" font-weight="700">2. Cross one out</text>
    <text x="700" y="342" font-size="17" fill="#344054">click the letter beside</text>
    <text x="700" y="364" font-size="17" fill="#344054">a choice you have ruled out</text>

    <rect x="688" y="392" width="248" height="86" rx="14" fill="#fff1f0" stroke="#f97066" stroke-width="2"/>
    <text x="812" y="420" font-size="16" font-weight="700" fill="#912018" text-anchor="middle">Cross out what conflicts</text>
    <text x="812" y="442" font-size="16" font-weight="700" fill="#912018" text-anchor="middle">with the text.</text>
    <text x="812" y="464" font-size="15" fill="#912018" text-anchor="middle">Never just what you don't know.</text>
  </g>
</svg>
