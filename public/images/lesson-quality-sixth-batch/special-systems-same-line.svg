<svg xmlns="http://www.w3.org/2000/svg" width="320" height="398" viewBox="0 0 320 398" role="img" aria-labelledby="title desc"><title id="title">The same line</title><desc id="desc">Coordinate graph of 4x+6y=10 and 10x+15y=25. A solid blue line and dashed orange line lie on the same path. Both have slope negative 2/3 and y-intercept 5/3, so every point on the line satisfies both equations.</desc><rect width="320" height="398" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="26" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Infinitely many solutions</text><line x1="14" y1="51" x2="45" y2="51" stroke="#2563eb" stroke-width="3.8" /><text x="54" y="57" font-size="19" fill="#172b3a" font-weight="400" text-anchor="start">4x + 6y = 10</text><line x1="14" y1="79" x2="45" y2="79" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5"/><text x="54" y="85" font-size="19" fill="#172b3a" font-weight="400" text-anchor="start">10x + 15y = 25</text><defs><clipPath id="plot"><rect x="48" y="120" width="240" height="192"/></clipPath></defs><line x1="48" y1="120" x2="48" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="96" y1="120" x2="96" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="144" y1="120" x2="144" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="192" y1="120" x2="192" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="240" y1="120" x2="240" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="288" y1="120" x2="288" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="312" x2="288" y2="312" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="264" x2="288" y2="264" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="216" x2="288" y2="216" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="168" x2="288" y2="168" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="120" x2="288" y2="120" stroke="#e2e8f0" stroke-width="1" /><line x1="48" y1="264" x2="288" y2="264" stroke="#475569" stroke-width="1.5" /><line x1="96" y1="120" x2="96" y2="312" stroke="#475569" stroke-width="1.5" /><text x="48" y="287" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">-1</text><text x="144" y="287" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">1</text><text x="192" y="287" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">2</text><text x="240" y="287" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">3</text><text x="288" y="287" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">4</text><text x="86" y="317" font-size="17" fill="#475569" font-weight="400" text-anchor="end">-1</text><text x="86" y="221" font-size="17" fill="#475569" font-weight="400" text-anchor="end">1</text><text x="86" y="173" font-size="17" fill="#475569" font-weight="400" text-anchor="end">2</text><text x="86" y="125" font-size="17" fill="#475569" font-weight="400" text-anchor="end">3</text><text x="88" y="285" font-size="17" fill="#475569" font-weight="400" text-anchor="end">0</text><text x="299" y="269" font-size="19" fill="#172b3a" font-weight="400" text-anchor="start">x</text><text x="104" y="113" font-size="19" fill="#172b3a" font-weight="400" text-anchor="start">y</text><g clip-path="url(#plot)"><line x1="48" y1="152" x2="288" y2="312" stroke="#2563eb" stroke-width="4" /><line x1="48" y1="152" x2="288" y2="312" stroke="#c2410c" stroke-width="2.8" stroke-dasharray="9 7"/></g><text x="12" y="345" font-size="18" fill="#172b3a" font-weight="600" text-anchor="start">Same slope, same intercept.</text><text x="12" y="374" font-size="18" fill="#172b3a" font-weight="400" text-anchor="start">Both: y = −(2/3)x + 5/3</text></g></svg>
