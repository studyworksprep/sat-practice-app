<svg xmlns="http://www.w3.org/2000/svg" width="340" height="344" viewBox="0 0 340 344" role="img" aria-labelledby="title desc"><title id="title">Read the value and RMSE</title><desc id="desc">Illustrated Desmos readout for 3n+4~19: REGRESSION PARAMETERS shows n=5. STATISTICS shows RMSE=0. Read n as the solution; use RMSE to check the match.</desc><rect width="340" height="344" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="28" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Read the value and RMSE</text><rect x="12" y="48" width="316" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="26" y="74" font-size="15" fill="#475569" font-weight="700" text-anchor="start">REGRESSION PARAMETERS</text><text x="34" y="115" font-size="29" fill="#172b3a" font-weight="400" text-anchor="start">n = 5</text><text x="26" y="145" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="start">This is the value of n.</text><rect x="12" y="178" width="316" height="112" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="26" y="204" font-size="15" fill="#475569" font-weight="700" text-anchor="start">STATISTICS</text><text x="34" y="246" font-size="27" fill="#172b3a" font-weight="400" text-anchor="start">RMSE = 0</text><text x="26" y="275" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">This checks the match.</text><text x="12" y="320" font-size="18" fill="#172b3a" font-weight="400" text-anchor="start">Example equation: 3n + 4 ~ 19</text></g></svg>
