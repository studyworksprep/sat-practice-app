<svg xmlns="http://www.w3.org/2000/svg" width="340" height="258" viewBox="0 0 340 258" role="img" aria-labelledby="title desc"><title id="title">Quantity times rate</title><desc id="desc">Six acres multiplied by a trees per acre equals 6a trees. Acre units in the quantity and denominator are crossed out; trees remain. Here a is the rate.</desc><rect width="340" height="258" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="28" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Quantity × matching rate</text><text x="20" y="101" font-size="27" fill="#172b3a" font-weight="400" text-anchor="start">6</text><text x="42" y="101" font-size="22" fill="#172b3a" font-weight="400" text-anchor="start">acres</text><text x="114" y="101" font-size="26" fill="#172b3a" font-weight="400" text-anchor="start">×</text><text x="209" y="77" font-size="23" fill="#172b3a" font-weight="400" text-anchor="middle">a trees</text><line x1="158" y1="87" x2="260" y2="87" stroke="#172b3a" stroke-width="1.5" /><text x="209" y="113" font-size="22" fill="#172b3a" font-weight="400" text-anchor="middle">acre</text><line x1="41" y1="106" x2="96" y2="86" stroke="#b45309" stroke-width="2.6" /><line x1="184" y1="118" x2="235" y2="98" stroke="#b45309" stroke-width="2.6" /><rect x="38" y="148" width="264" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="170" y="186" font-size="27" fill="#1d4ed8" font-weight="600" text-anchor="middle">= 6a trees</text><text x="170" y="240" font-size="20" fill="#172b3a" font-weight="400" text-anchor="middle">Acre units cancel.</text></g></svg>
