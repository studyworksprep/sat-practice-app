<svg xmlns="http://www.w3.org/2000/svg" width="340" height="258" viewBox="0 0 340 258" role="img" aria-labelledby="title desc"><title id="title">Rate times quantity</title><desc id="desc">Five dollars per notebook multiplied by n notebooks equals 5n dollars. The notebook unit in the denominator and the notebook unit in the quantity are crossed out; dollars remain.</desc><rect width="340" height="258" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="28" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Rate × matching quantity</text><text x="20" y="101" font-size="27" fill="#172b3a" font-weight="400" text-anchor="start">5</text><text x="86" y="77" font-size="22" fill="#172b3a" font-weight="400" text-anchor="middle">dollars</text><line x1="43" y1="87" x2="131" y2="87" stroke="#172b3a" stroke-width="1.5" /><text x="86" y="113" font-size="20" fill="#172b3a" font-weight="400" text-anchor="middle">notebook</text><text x="145" y="101" font-size="26" fill="#172b3a" font-weight="400" text-anchor="start">×</text><text x="181" y="101" font-size="27" fill="#172b3a" font-weight="400" text-anchor="start">n</text><text x="211" y="101" font-size="20" fill="#172b3a" font-weight="400" text-anchor="start">notebooks</text><line x1="42" y1="118" x2="132" y2="97" stroke="#b45309" stroke-width="2.6" /><line x1="211" y1="106" x2="307" y2="87" stroke="#b45309" stroke-width="2.6" /><rect x="38" y="148" width="264" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="170" y="186" font-size="27" fill="#1d4ed8" font-weight="600" text-anchor="middle">= 5n dollars</text><text x="170" y="240" font-size="20" fill="#172b3a" font-weight="400" text-anchor="middle">Notebook units cancel.</text></g></svg>
