<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Typing a percent sign makes Desmos insert the word of</title>
  <desc id="desc">Two Desmos rows. The first reads 35% of 80 equals 28, with the word of highlighted as the part Desmos inserted automatically after the percent sign was typed. The second reads 0.35 times 80 equals 28, the matching decimal calculation, which gives the same result.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="28" fill="#f6f8fb"/>

  <rect x="46" y="42" width="530" height="286" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="46" y="42" width="530" height="54" rx="18" fill="#f0f2f5"/>
  <circle cx="80" cy="69" r="11" fill="#98a2b3"/>
  <rect x="104" y="58" width="180" height="22" rx="8" fill="#d0d5dd"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#344054">
    <!-- Row 1: the percent form -->
    <text x="80" y="152" font-size="30">35% </text>
    <rect x="152" y="126" width="56" height="38" rx="8" fill="#fff1f0" stroke="#f97066" stroke-width="3"/>
    <text x="180" y="153" font-size="30" text-anchor="middle" fill="#912018">of</text>
    <text x="220" y="152" font-size="30">80</text>
    <text x="440" y="152" font-size="26" fill="#667085">=</text>
    <rect x="466" y="128" width="72" height="36" rx="8" fill="#f0f2f5" stroke="#d0d5dd" stroke-width="2"/>
    <text x="502" y="154" font-size="26" text-anchor="middle" fill="#101828">28</text>
    <line x1="66" y1="188" x2="556" y2="188" stroke="#e4e7ec" stroke-width="2"/>

    <!-- Row 2: the decimal form. The multiplication dot is drawn as a
         circle rather than typed, so no font substitution can drop it. -->
    <text x="80" y="246" font-size="30">0.35</text>
    <circle cx="152" cy="238" r="4" fill="#344054"/>
    <text x="168" y="246" font-size="30">80</text>
    <text x="440" y="246" font-size="26" fill="#667085">=</text>
    <rect x="466" y="222" width="72" height="36" rx="8" fill="#f0f2f5" stroke="#d0d5dd" stroke-width="2"/>
    <text x="502" y="248" font-size="26" text-anchor="middle" fill="#101828">28</text>
  </g>

  <path d="M690 128 C620 132, 400 138, 190 122" fill="none" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="792" y="88" text-anchor="middle" font-size="29" font-weight="700">Desmos adds this</text>
    <text x="792" y="120" text-anchor="middle" font-size="20">as soon as you type %</text>
    <rect x="628" y="196" width="308" height="104" rx="14" fill="#fff1f0" stroke="#f97066" stroke-width="2"/>
    <text x="782" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#912018">Type 35% then the number.</text>
    <text x="782" y="256" text-anchor="middle" font-size="17" fill="#912018">Do not type the word "of"</text>
    <text x="782" y="282" text-anchor="middle" font-size="17" fill="#912018">yourself - it is already there.</text>
  </g>
</svg>
