<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">What Desmos shows under a table regression</title>
  <desc id="desc">A regression row reading y sub 1 tilde a times open paren x sub 1 minus 2 close paren squared plus 5. Below it, a REGRESSION PARAMETERS section shows a equals 3, and a STATISTICS section shows R squared equals 1 and r equals 1. A callout marks the assigned constant as the value to read.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="28" fill="#f6f8fb"/>

  <!-- Expression-list card -->
  <rect x="46" y="42" width="530" height="346" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="46" y="42" width="530" height="54" rx="18" fill="#f0f2f5"/>
  <circle cx="80" cy="69" r="11" fill="#98a2b3"/>
  <rect x="104" y="58" width="180" height="22" rx="8" fill="#d0d5dd"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#344054">
    <!-- the regression row itself -->
    <text x="80" y="140" font-size="27" font-style="italic">y</text>
    <text x="94" y="149" font-size="17">1</text>
    <text x="106" y="140" font-size="27">~ a(x</text>
    <text x="181" y="149" font-size="17">1</text>
    <text x="192" y="140" font-size="27">- 2)</text>
    <text x="245" y="128" font-size="17">2</text>
    <text x="258" y="140" font-size="27">+ 5</text>

    <text x="80" y="188" font-size="17" font-weight="700" fill="#667085" letter-spacing="1">REGRESSION PARAMETERS</text>
    <rect x="72" y="200" width="150" height="44" rx="8" fill="#fff1f0" stroke="#f97066" stroke-width="3"/>
    <text x="88" y="231" font-size="27" fill="#101828">a = 3</text>

    <text x="80" y="286" font-size="17" font-weight="700" fill="#667085" letter-spacing="1">STATISTICS</text>
    <text x="80" y="322" font-size="24">R</text>
    <text x="97" y="310" font-size="16">2</text>
    <text x="108" y="322" font-size="24">= 1</text>
    <text x="80" y="356" font-size="24" font-style="italic">r</text>
    <text x="95" y="356" font-size="24">= 1</text>

    <text x="330" y="286" font-size="17" font-weight="700" fill="#667085" letter-spacing="1">RESIDUALS</text>
    <text x="330" y="322" font-size="24" font-style="italic">e</text>
    <text x="344" y="330" font-size="16">1</text>
    <rect x="374" y="302" width="72" height="30" rx="7" fill="#f0f2f5" stroke="#d0d5dd" stroke-width="2"/>
    <text x="410" y="323" font-size="18" text-anchor="middle">plot</text>
  </g>

  <!-- Callout -->
  <path d="M700 176 C660 190, 620 204, 236 222" fill="none" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="778" y="118" text-anchor="middle" font-size="30" font-weight="700">Read this value</text>
    <text x="778" y="152" text-anchor="middle" font-size="21">the constant Desmos assigned</text>
    <rect x="628" y="256" width="300" height="104" rx="14" fill="#fff1f0" stroke="#f97066" stroke-width="2"/>
    <text x="778" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#912018">A table regression reports</text>
    <text x="778" y="314" text-anchor="middle" font-size="19" font-weight="700" fill="#912018">R squared and r.</text>
    <text x="778" y="342" text-anchor="middle" font-size="17" fill="#912018">Closer to 1 means a closer fit.</text>
  </g>
</svg>
