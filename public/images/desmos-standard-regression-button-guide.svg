<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Where to find the Regression button beside a Desmos table</title>
  <desc id="desc">A simplified Desmos table with x and y columns. An arrow points to the Regression button, shown as a small fitted line with four scatterplot dots.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="28" fill="#f6f8fb"/>
  <rect x="54" y="42" width="520" height="346" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="54" y="42" width="520" height="62" rx="18" fill="#f0f2f5"/>
  <circle cx="90" cy="73" r="12" fill="#98a2b3"/>
  <rect x="116" y="61" width="190" height="24" rx="8" fill="#d0d5dd"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="94" y="126" width="190" height="54" fill="#edf4ff" stroke="#98a2b3" stroke-width="2"/>
    <rect x="284" y="126" width="190" height="54" fill="#edf4ff" stroke="#98a2b3" stroke-width="2"/>
    <text x="189" y="161" font-size="26" font-weight="700" fill="#344054">x</text>
    <text x="379" y="161" font-size="26" font-weight="700" fill="#344054">y</text>

    <g font-size="23" fill="#344054">
      <rect x="94" y="180" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <rect x="284" y="180" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <text x="189" y="214">0</text><text x="379" y="214">2</text>
      <rect x="94" y="232" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <rect x="284" y="232" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <text x="189" y="266">1</text><text x="379" y="266">5</text>
      <rect x="94" y="284" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <rect x="284" y="284" width="190" height="52" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
      <text x="189" y="318">2</text><text x="379" y="318">8</text>
    </g>
  </g>

  <rect x="492" y="216" width="62" height="62" rx="12" fill="#ffffff" stroke="#b42318" stroke-width="5"/>
  <g transform="translate(502 228)">
    <path d="M3 32 C14 28, 23 18, 43 5" fill="none" stroke="#344054" stroke-width="4" stroke-linecap="round"/>
    <circle cx="8" cy="27" r="5" fill="#2e90fa"/>
    <circle cx="18" cy="24" r="5" fill="#2e90fa"/>
    <circle cx="29" cy="13" r="5" fill="#2e90fa"/>
    <circle cx="43" cy="10" r="5" fill="#2e90fa"/>
  </g>

  <path d="M805 142 C750 150, 690 184, 570 234" fill="none" stroke="#b42318" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="730" y="86" text-anchor="middle" font-size="30" font-weight="700">Regression button</text>
    <text x="730" y="120" text-anchor="middle" font-size="21">a fitted line with four dots</text>
    <rect x="626" y="286" width="280" height="76" rx="14" fill="#fff1f0" stroke="#f97066" stroke-width="2"/>
    <text x="766" y="317" text-anchor="middle" font-size="20" font-weight="700" fill="#912018">Click after entering points.</text>
    <text x="766" y="344" text-anchor="middle" font-size="18" fill="#912018">Then choose the model type.</text>
  </g>
</svg>
