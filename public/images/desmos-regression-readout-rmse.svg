<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">What Desmos shows under a one-equation regression</title>
  <desc id="desc">A regression row reading 5 q plus 7 tilde 42. Below it, a REGRESSION PARAMETERS section shows q equals 7, and a STATISTICS section shows RMSE equals 0. Callouts mark the assigned value to read and the RMSE as the match check.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="28" fill="#f6f8fb"/>

  <rect x="46" y="42" width="530" height="316" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="46" y="42" width="530" height="54" rx="18" fill="#f0f2f5"/>
  <circle cx="80" cy="69" r="11" fill="#98a2b3"/>
  <rect x="104" y="58" width="180" height="22" rx="8" fill="#d0d5dd"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#344054">
    <text x="80" y="144" font-size="28">5</text>
    <text x="98" y="144" font-size="28" font-style="italic">q</text>
    <text x="116" y="144" font-size="28">+ 7 ~ 42</text>

    <text x="80" y="196" font-size="17" font-weight="700" fill="#667085" letter-spacing="1">REGRESSION PARAMETERS</text>
    <rect x="72" y="208" width="150" height="44" rx="8" fill="#fff1f0" stroke="#f97066" stroke-width="3"/>
    <text x="88" y="239" font-size="27" fill="#101828">q = 7</text>

    <text x="80" y="292" font-size="17" font-weight="700" fill="#667085" letter-spacing="1">STATISTICS</text>
    <rect x="72" y="304" width="184" height="42" rx="8" fill="#eef6ff" stroke="#2e90fa" stroke-width="3"/>
    <text x="88" y="333" font-size="24" fill="#101828">RMSE = 0</text>
  </g>

  <path d="M690 178 C650 194, 600 210, 236 230" fill="none" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M690 300 C620 312, 500 322, 270 325" fill="none" stroke="#2e90fa" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#2e90fa"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="778" y="120" text-anchor="middle" font-size="30" font-weight="700">The answer</text>
    <text x="778" y="154" text-anchor="middle" font-size="21">the value Desmos assigned</text>
    <rect x="628" y="256" width="300" height="94" rx="14" fill="#eef6ff" stroke="#2e90fa" stroke-width="2"/>
    <text x="778" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#0b4a6f">RMSE checks the match.</text>
    <text x="778" y="314" text-anchor="middle" font-size="17" fill="#0b4a6f">Zero or tiny means the two</text>
    <text x="778" y="338" text-anchor="middle" font-size="17" fill="#0b4a6f">sides fit. Large means recheck.</text>
  </g>
</svg>
