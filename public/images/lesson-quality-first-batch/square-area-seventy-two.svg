<title id="title">Find a diagonal from area</title><desc id="desc">A square labeled area 72, with each side labeled s and its diagonal labeled d.</desc>
<rect x="1" y="1" width="638" height="428" rx="20" fill="#f8fafc" stroke="#e4e7ec"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><path d="M 172 65 H 442 V 335 H 172 Z" stroke="#17324d" stroke-width="4" fill="#eef4ff" stroke-linejoin="round"/><line x1="172.00" y1="335.00" x2="442.00" y2="65.00" stroke="#175cd3" stroke-width="5"/><path d="M 424 335 V 317 H 442" stroke="#b54708" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M 190 65 V 83 H 172" stroke="#b54708" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="139.00" y="208.00" text-anchor="middle" font-size="30" fill="#067647">s</text><text x="307.00" y="379.00" text-anchor="middle" font-size="30" fill="#067647">s</text><text x="323.00" y="188.00" text-anchor="middle" font-size="28" fill="#175cd3" transform="rotate(-45 323.0 188.0)">d</text><text x="271.00" y="130.00" text-anchor="middle" font-size="24" fill="#17324d">Area = 72</text></g></svg>