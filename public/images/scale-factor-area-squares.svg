<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">A scale factor of three makes the area nine times as large</title>
  <desc id="desc">A square with side length 2 and area 4 is compared with a similar square with side length 6 and area 36. Each side is multiplied by 3, so the area is multiplied by 3 times 3, or 9.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#175cd3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="210" y="54" text-anchor="middle" font-size="28" font-weight="700">Original square</text>
    <text x="850" y="54" text-anchor="middle" font-size="28" font-weight="700">Similar square</text>

    <rect x="130" y="150" width="160" height="160" fill="#dbeafe" stroke="#175cd3" stroke-width="5" filter="url(#shadow)"/>
    <line x1="210" y1="150" x2="210" y2="310" stroke="#84adff" stroke-width="3"/>
    <line x1="130" y1="230" x2="290" y2="230" stroke="#84adff" stroke-width="3"/>
    <text x="210" y="342" text-anchor="middle" font-size="23">side = 2</text>
    <text x="210" y="380" text-anchor="middle" font-size="25" font-weight="700" fill="#175cd3">area = 4</text>

    <line x1="360" y1="225" x2="520" y2="225" stroke="#175cd3" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="440" y="198" text-anchor="middle" font-size="28" font-weight="700" fill="#175cd3">each side × 3</text>

    <rect x="680" y="90" width="340" height="340" fill="#dcfae6" stroke="#067647" stroke-width="5" filter="url(#shadow)"/>
    <g stroke="#75e0a7" stroke-width="2">
      <line x1="736.667" y1="90" x2="736.667" y2="430"/>
      <line x1="793.333" y1="90" x2="793.333" y2="430"/>
      <line x1="850" y1="90" x2="850" y2="430"/>
      <line x1="906.667" y1="90" x2="906.667" y2="430"/>
      <line x1="963.333" y1="90" x2="963.333" y2="430"/>
      <line x1="680" y1="146.667" x2="1020" y2="146.667"/>
      <line x1="680" y1="203.333" x2="1020" y2="203.333"/>
      <line x1="680" y1="260" x2="1020" y2="260"/>
      <line x1="680" y1="316.667" x2="1020" y2="316.667"/>
      <line x1="680" y1="373.333" x2="1020" y2="373.333"/>
    </g>
    <text x="850" y="462" text-anchor="middle" font-size="23">side = 6</text>
    <text x="850" y="496" text-anchor="middle" font-size="25" font-weight="700" fill="#067647">area = 36</text>

    <rect x="322" y="310" width="302" height="104" rx="16" fill="#eff8ff" stroke="#84adff" stroke-width="2"/>
    <text x="473" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#1849a9">Area uses two dimensions</text>
    <text x="473" y="386" text-anchor="middle" font-size="27" fill="#1849a9">3 × 3 = 3² = 9</text>
  </g>
</svg>
