<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">A right triangle split by an altitude to its hypotenuse</title>
  <desc id="desc">Right triangle ABC has horizontal hypotenuse AB along the bottom and right angle C at the top. Altitude CD drops vertically to point D on AB, forming smaller right triangles ACD and CBD. Angle colors show the three triangles have matching angles and are similar.</desc>
  <rect width="1120" height="600" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="560" y="46" text-anchor="middle" font-size="29" font-weight="700">Altitude from the right angle to the hypotenuse</text>
    <path d="M110 510 L1010 510 L434 78 Z" fill="#eff8ff" stroke="#102a43" stroke-width="7" stroke-linejoin="round"/>
    <path d="M434 78 L434 510" stroke="#7f56d9" stroke-width="7"/>

    <path d="M416 102 L440 120 L458 96" fill="none" stroke="#c4320a" stroke-width="5"/>
    <path d="M434 510 L434 478 L466 478 L466 510" fill="none" stroke="#c4320a" stroke-width="5"/>
    <path d="M162 510 A52 52 0 0 0 151.6 478.8" fill="none" stroke="#067647" stroke-width="6"/>
    <path d="M958 510 A52 52 0 0 1 968.4 471" fill="none" stroke="#175cd3" stroke-width="6"/>
    <path d="M416 102 A44 44 0 0 0 399.2 129" fill="none" stroke="#175cd3" stroke-width="6"/>
    <path d="M452 102 A44 44 0 0 1 468.8 129" fill="none" stroke="#067647" stroke-width="6"/>

    <circle cx="110" cy="510" r="8" fill="#067647"/>
    <circle cx="1010" cy="510" r="8" fill="#175cd3"/>
    <circle cx="434" cy="78" r="8" fill="#c4320a"/>
    <circle cx="434" cy="510" r="8" fill="#c4320a"/>
    <text x="70" y="552" font-size="28" font-weight="700" fill="#067647">A</text>
    <text x="1022" y="552" font-size="28" font-weight="700" fill="#175cd3">B</text>
    <text x="432" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#c4320a">C</text>
    <text x="434" y="552" text-anchor="middle" font-size="28" font-weight="700" fill="#c4320a">D</text>

    <rect x="238" y="144" width="236" height="132" rx="16" fill="#ffffff" stroke="#d0d5dd" stroke-width="3"/>
    <text x="356" y="184" text-anchor="middle" font-size="22" font-weight="700">Three triangles</text>
    <text x="356" y="222" text-anchor="middle" font-size="24">△ABC</text>
    <text x="356" y="256" text-anchor="middle" font-size="24">△ACD and △CBD</text>

    <text x="560" y="584" text-anchor="middle" font-size="23" fill="#475467">AB is the large triangle's hypotenuse; CD is the altitude.</text>
  </g>
</svg>
