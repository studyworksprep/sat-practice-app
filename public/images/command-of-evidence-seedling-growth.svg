<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Average seedling height after fourteen days by light level and nutrient solution</title>
  <desc id="desc">Grouped bar graph. Under low light, seedlings averaged 4 centimeters with standard solution and 5 with mineral supplement. Under medium light, they averaged 8 and 12 centimeters. Under high light, they averaged 12 and 18 centimeters.</desc>
  <rect width="760" height="520" rx="18" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Average Seedling Height after 14 Days</text>

  <line x1="96" y1="80" x2="96" y2="410" stroke="#172033" stroke-width="2"/>
  <line x1="96" y1="410" x2="708" y2="410" stroke="#172033" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#46516a">
    <line x1="96" y1="410" x2="708" y2="410" stroke="#d9deea"/>
    <line x1="96" y1="344" x2="708" y2="344" stroke="#d9deea"/>
    <line x1="96" y1="278" x2="708" y2="278" stroke="#d9deea"/>
    <line x1="96" y1="212" x2="708" y2="212" stroke="#d9deea"/>
    <line x1="96" y1="146" x2="708" y2="146" stroke="#d9deea"/>
    <line x1="96" y1="80" x2="708" y2="80" stroke="#d9deea"/>
    <text x="82" y="415" text-anchor="end">0</text>
    <text x="82" y="349" text-anchor="end">4</text>
    <text x="82" y="283" text-anchor="end">8</text>
    <text x="82" y="217" text-anchor="end">12</text>
    <text x="82" y="151" text-anchor="end">16</text>
    <text x="82" y="85" text-anchor="end">20</text>
  </g>

  <text x="27" y="245" text-anchor="middle" transform="rotate(-90 27 245)" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#172033">Average height (centimeters)</text>
  <text x="402" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#172033">Light level</text>

  <g>
    <rect x="163" y="344" width="62" height="66" rx="4" fill="#9ca8ba"/>
    <rect x="229" y="327.5" width="62" height="82.5" rx="4" fill="#246bce"/>
    <rect x="350" y="278" width="62" height="132" rx="4" fill="#9ca8ba"/>
    <rect x="416" y="212" width="62" height="198" rx="4" fill="#246bce"/>
    <rect x="537" y="212" width="62" height="198" rx="4" fill="#9ca8ba"/>
    <rect x="603" y="113" width="62" height="297" rx="4" fill="#246bce"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="194" y="336">4</text>
    <text x="260" y="319">5</text>
    <text x="381" y="270">8</text>
    <text x="447" y="204">12</text>
    <text x="568" y="204">12</text>
    <text x="634" y="105">18</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="middle">
    <text x="227" y="440">Low</text>
    <text x="414" y="440">Medium</text>
    <text x="601" y="440">High</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <rect x="466" y="53" width="18" height="12" rx="2" fill="#9ca8ba"/>
    <text x="491" y="64">Standard solution</text>
    <rect x="606" y="53" width="18" height="12" rx="2" fill="#246bce"/>
    <text x="631" y="64">Mineral supplement</text>
  </g>
</svg>
