<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">A smaller triangle formed by a segment parallel to the base of a larger triangle</title>
  <desc id="desc">Large triangle ABC has A at the top, B at the lower left, and C at the lower right. Points D and E lie on sides AB and AC. Segment DE is parallel to base BC, so triangle ADE and triangle ABC have two pairs of equal corresponding angles.</desc>
  <rect width="1120" height="560" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101828">
    <text x="560" y="48" text-anchor="middle" font-size="29" font-weight="700">Similarity can be hidden inside one diagram</text>
    <path d="M560 82 L125 480 L995 480 Z" fill="#eff8ff" stroke="#102a43" stroke-width="6" stroke-linejoin="round"/>
    <path d="M340 283 L780 283" stroke="#175cd3" stroke-width="7"/>
    <path d="M534 112 A42 42 0 0 0 586 112" fill="none" stroke="#7f56d9" stroke-width="6"/>
    <path d="M166 442 A54 54 0 0 0 204 480" fill="none" stroke="#067647" stroke-width="6"/>
    <path d="M368 256 A38 38 0 0 0 394 283" fill="none" stroke="#067647" stroke-width="6"/>
    <path d="M916 480 A54 54 0 0 0 954 442" fill="none" stroke="#175cd3" stroke-width="6"/>
    <path d="M726 283 A38 38 0 0 0 752 256" fill="none" stroke="#175cd3" stroke-width="6"/>
    <g stroke="#175cd3" stroke-width="4">
      <path d="M525 283 l14 -10 l14 10" fill="none"/>
      <path d="M552 283 l14 -10 l14 10" fill="none"/>
      <path d="M525 480 l14 -10 l14 10" fill="none"/>
      <path d="M552 480 l14 -10 l14 10" fill="none"/>
    </g>
    <circle cx="560" cy="82" r="7" fill="#7f56d9"/>
    <circle cx="125" cy="480" r="7" fill="#067647"/>
    <circle cx="995" cy="480" r="7" fill="#175cd3"/>
    <circle cx="340" cy="283" r="7" fill="#067647"/>
    <circle cx="780" cy="283" r="7" fill="#175cd3"/>
    <text x="550" y="76" text-anchor="end" font-size="27" font-weight="700" fill="#7f56d9">A</text>
    <text x="88" y="518" font-size="27" font-weight="700" fill="#067647">B</text>
    <text x="1005" y="518" font-size="27" font-weight="700" fill="#175cd3">C</text>
    <text x="302" y="282" font-size="27" font-weight="700" fill="#067647">D</text>
    <text x="794" y="282" font-size="27" font-weight="700" fill="#175cd3">E</text>
    <rect x="390" y="388" width="340" height="62" rx="14" fill="#ffffff" stroke="#84adff" stroke-width="3"/>
    <text x="560" y="428" text-anchor="middle" font-size="25" font-weight="700" fill="#1849a9">DE ∥ BC</text>
  </g>
</svg>
