<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Tangent segments from the same outside point</title><desc id="desc">A circle centered at O has tangent segments PA and PB from outside point P. PA is labeled 2u and PB is labeled 3u minus 2; both have matching length marks.</desc><rect width="520" height="440" fill="#f8fafc" rx="12"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="220" r="120" fill="none" stroke="#94a3b8" stroke-width="2.5"/><path d="M380 220L252 124" fill="none" stroke="#335fc4" stroke-width="3" /><path d="M380 220L252 316" fill="none" stroke="#335fc4" stroke-width="3" /><path d="M320.2 166.4L311.8 177.6" fill="none" stroke="#23374d" stroke-width="2" /><path d="M311.8 262.4L320.2 273.6" fill="none" stroke="#23374d" stroke-width="2" /><circle cx="180" cy="220" r="4" fill="#23374d"/><text x="160" y="245" text-anchor="middle" fill="#23374d" font-size="25">O</text><text x="245" y="106" text-anchor="middle" fill="#23374d" font-size="25">A</text><text x="245" y="345" text-anchor="middle" fill="#23374d" font-size="25">B</text><text x="405" y="227" text-anchor="middle" fill="#23374d" font-size="25">P</text><text x="344" y="154" text-anchor="middle" fill="#335fc4" font-size="23">2u</text><text x="352" y="298" text-anchor="middle" fill="#335fc4" font-size="23">3u − 2</text></g></svg>
