<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Two angles intercepting arc AB</title><desc id="desc">Circle centered at O with A at the right, B at the top, and C at the left. Arc AB is highlighted. The central angle AOB is 90 degrees, and the inscribed angle ACB is 45 degrees.</desc><rect width="520" height="440" fill="#f8fafc" rx="12"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="230" cy="230" r="150" fill="none" stroke="#94a3b8" stroke-width="2.5"/><path d="M80 230L380 230" fill="none" stroke="#23374d" stroke-width="3" /><path d="M230 230L230 80" fill="none" stroke="#23374d" stroke-width="3" /><path d="M80 230L230 80" fill="none" stroke="#23374d" stroke-width="3" /><path d="M380 230A150 150 0 0 0 230 80" fill="none" stroke="#335fc4" stroke-width="6"/><path d="M248 230L248 212" fill="none" stroke="#a95b2c" stroke-width="2" /><path d="M248 212L230 212" fill="none" stroke="#a95b2c" stroke-width="2" /><path d="M114 230A34 34 0 0 0 104.042 205.958" fill="none" stroke="#a95b2c" stroke-width="2"/><circle cx="230" cy="230" r="4" fill="#23374d"/><text x="214" y="259" text-anchor="middle" fill="#23374d" font-size="25">O</text><text x="405" y="237" text-anchor="middle" fill="#23374d" font-size="25">A</text><text x="230" y="53" text-anchor="middle" fill="#23374d" font-size="25">B</text><text x="56" y="237" text-anchor="middle" fill="#23374d" font-size="25">C</text><text x="278" y="202" text-anchor="middle" fill="#a95b2c" font-size="23">90°</text><text x="143" y="214" text-anchor="middle" fill="#a95b2c" font-size="23">45°</text></g></svg>
