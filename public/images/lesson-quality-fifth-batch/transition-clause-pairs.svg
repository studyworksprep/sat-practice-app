<svg xmlns="http://www.w3.org/2000/svg" width="320" height="422" viewBox="0 0 320 422" role="img" aria-labelledby="title desc"><title id="title">Which pair does the transition connect?</title><desc id="desc">Two clause maps. In A. B, however; C., however belongs to B and connects A to B. In A. B; however, C., however belongs to C and connects B to C.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><rect width="320" height="422" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="6" y="8" width="308" height="194" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="20" y="36" font-size="19" fill="#172b3a" font-weight="700">Before the full stop</text><text x="20" y="66" font-size="19" fill="#172b3a" font-weight="400">A. B, however; C.</text><text x="20" y="94" font-size="17" fill="#1d4ed8" font-weight="700">Test A → B</text><rect x="20" y="109" width="78" height="43" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="47" y="137" font-size="22" fill="#172b3a" font-weight="700">A</text><rect x="120" y="109" width="78" height="43" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="147" y="137" font-size="22" fill="#172b3a" font-weight="700">B</text><rect x="220" y="109" width="78" height="43" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="247" y="137" font-size="22" fill="#172b3a" font-weight="700">C</text><path d="M99 130 L118 130" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="20" y="182" font-size="17" fill="#172b3a" font-weight="600">“However” belongs to B.</text><rect x="6" y="216" width="308" height="194" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="20" y="244" font-size="19" fill="#172b3a" font-weight="700">After the full stop</text><text x="20" y="274" font-size="19" fill="#172b3a" font-weight="400">A. B; however, C.</text><text x="20" y="302" font-size="17" fill="#1d4ed8" font-weight="700">Test B → C</text><rect x="20" y="317" width="78" height="43" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="47" y="345" font-size="22" fill="#172b3a" font-weight="700">A</text><rect x="120" y="317" width="78" height="43" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="147" y="345" font-size="22" fill="#172b3a" font-weight="700">B</text><rect x="220" y="317" width="78" height="43" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="247" y="345" font-size="22" fill="#172b3a" font-weight="700">C</text><path d="M199 338 L218 338" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="20" y="390" font-size="17" fill="#172b3a" font-weight="600">“However” belongs to C.</text></g></svg>
