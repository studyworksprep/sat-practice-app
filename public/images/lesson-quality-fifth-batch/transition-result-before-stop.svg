<svg xmlns="http://www.w3.org/2000/svg" width="320" height="568" viewBox="0 0 320 568" role="img" aria-labelledby="title desc"><title id="title">Therefore belongs to B</title><desc id="desc">Clause A: The observatory’s main telescope was under repair. Clause B: Astronomers used a smaller backup telescope, therefore; clause C: The backup instrument had been installed in 2018. A causes B, so therefore stays in B before the semicolon. C gives background.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><rect width="320" height="568" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="28" font-size="24" fill="#172b3a" font-weight="700">A result: A → B</text><rect x="10" y="58" width="300" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="24" y="85" font-size="20" fill="#1d4ed8" font-weight="700">Clause A</text><text x="24" y="112" font-size="22" fill="#172b3a" font-weight="400">The observatory’s main</text><text x="24" y="136" font-size="22" fill="#172b3a" font-weight="400">telescope was under</text><text x="24" y="160" font-size="22" fill="#172b3a" font-weight="400">repair.</text><rect x="10" y="221" width="300" height="137" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="24" y="248" font-size="20" fill="#1d4ed8" font-weight="700">Clause B</text><text x="24" y="275" font-size="22" fill="#172b3a" font-weight="400">Astronomers used a smaller</text><text x="24" y="299" font-size="22" fill="#172b3a" font-weight="400">backup telescope,</text><text x="24" y="323" font-size="22" fill="#172b3a" font-weight="400">therefore;</text><rect x="10" y="400" width="300" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="24" y="427" font-size="20" fill="#475569" font-weight="700">Clause C</text><text x="24" y="454" font-size="22" fill="#172b3a" font-weight="400">The backup instrument</text><text x="24" y="478" font-size="22" fill="#172b3a" font-weight="400">had been installed</text><text x="24" y="502" font-size="22" fill="#172b3a" font-weight="400">in 2018.</text><path d="M160 174 L160 215" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="173" y="200" font-size="20" fill="#1d4ed8" font-weight="700">result</text><text x="12" y="548" font-size="21" fill="#1d4ed8" font-weight="700">Therefore stays inside B.</text></g></svg>
