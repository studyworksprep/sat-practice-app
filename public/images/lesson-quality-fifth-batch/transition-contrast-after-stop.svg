<svg xmlns="http://www.w3.org/2000/svg" width="320" height="568" viewBox="0 0 320 568" role="img" aria-labelledby="title desc"><title id="title">However belongs to C</title><desc id="desc">Clause A: Repairs to the telescope ended on Monday. Clause B: Astronomers expected to resume observations that night; clause C: however, dense clouds covered the sky. B and C contrast, so however begins C after the semicolon.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><rect width="320" height="568" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="28" font-size="24" fill="#172b3a" font-weight="700">A contrast: B → C</text><rect x="10" y="58" width="300" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="24" y="85" font-size="20" fill="#475569" font-weight="700">Clause A</text><text x="24" y="112" font-size="22" fill="#172b3a" font-weight="400">Repairs to the telescope</text><text x="24" y="136" font-size="22" fill="#172b3a" font-weight="400">ended on Monday.</text><rect x="10" y="207" width="300" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="24" y="234" font-size="20" fill="#1d4ed8" font-weight="700">Clause B</text><text x="24" y="261" font-size="22" fill="#172b3a" font-weight="400">Astronomers expected to</text><text x="24" y="285" font-size="22" fill="#172b3a" font-weight="400">resume observations</text><text x="24" y="309" font-size="22" fill="#172b3a" font-weight="400">that night;</text><rect x="10" y="386" width="300" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="24" y="413" font-size="20" fill="#1d4ed8" font-weight="700">Clause C</text><text x="24" y="440" font-size="22" fill="#172b3a" font-weight="400">however, dense clouds</text><text x="24" y="464" font-size="22" fill="#172b3a" font-weight="400">covered the sky.</text><path d="M160 324 L160 380" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="173" y="357" font-size="20" fill="#1d4ed8" font-weight="700">contrast</text><text x="12" y="540" font-size="21" fill="#1d4ed8" font-weight="700">However begins C.</text></g></svg>
