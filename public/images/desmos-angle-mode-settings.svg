<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Choose radians or degrees in Desmos Graph Settings</title>
  <desc id="desc">A simplified Desmos calculator shows the Graph Settings wrench. A settings panel displays Angle Measure choices for Radians and Degrees, with an arrow emphasizing that students must choose the mode that matches the problem.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="28" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#101828">Set the angle mode before calculating</text>

    <rect x="52" y="86" width="896" height="420" rx="20" fill="#ffffff" stroke="#d0d5dd" stroke-width="3" filter="url(#shadow)"/>
    <rect x="52" y="86" width="896" height="62" rx="20" fill="#eef1f5"/>
    <circle cx="90" cy="117" r="12" fill="#98a2b3"/>
    <rect x="118" y="105" width="220" height="24" rx="8" fill="#d0d5dd"/>

    <rect x="92" y="184" width="360" height="78" rx="14" fill="#f9fafb" stroke="#d0d5dd" stroke-width="2"/>
    <circle cx="122" cy="223" r="15" fill="#2e90fa"/>
    <text x="158" y="233" font-size="28" fill="#344054">sin(30)</text>
    <rect x="92" y="286" width="360" height="78" rx="14" fill="#f9fafb" stroke="#d0d5dd" stroke-width="2"/>
    <circle cx="122" cy="325" r="15" fill="#12b76a"/>
    <text x="158" y="335" font-size="28" fill="#344054">tan(35)</text>

    <rect x="851" y="97" width="54" height="44" rx="10" fill="#ffffff" stroke="#b42318" stroke-width="4"/>
    <g transform="translate(878 119) rotate(45)">
      <rect x="-3.5" y="-2" width="7" height="18" rx="3" fill="#344054"/>
      <circle cx="0" cy="-8" r="8" fill="#344054"/>
      <rect x="-3" y="-19" width="6" height="11" fill="#ffffff"/>
      <circle cx="0" cy="-8" r="3.5" fill="#ffffff"/>
    </g>
    <text x="700" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#b42318">Graph Settings</text>
    <path d="M780 120 L845 120" stroke="#b42318" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="500" y="166" width="390" height="290" rx="18" fill="#ffffff" stroke="#98a2b3" stroke-width="3" filter="url(#shadow)"/>
    <text x="535" y="211" font-size="25" font-weight="700" fill="#101828">Angle Measure</text>
    <circle cx="542" cy="264" r="16" fill="#ffffff" stroke="#667085" stroke-width="3"/>
    <circle cx="542" cy="264" r="9" fill="#667085"/>
    <text x="578" y="273" font-size="26" fill="#344054">Radians</text>
    <text x="746" y="273" font-size="19" fill="#667085">default</text>
    <circle cx="542" cy="328" r="16" fill="#ffffff" stroke="#175cd3" stroke-width="4"/>
    <text x="578" y="337" font-size="26" font-weight="700" fill="#175cd3">Degrees</text>
    <rect x="514" y="296" width="220" height="64" rx="30" fill="none" stroke="#b42318" stroke-width="4"/>

    <rect x="540" y="372" width="310" height="72" rx="14" fill="#fff1f0" stroke="#f97066" stroke-width="2"/>
    <text x="695" y="402" text-anchor="middle" font-size="20" font-weight="700" fill="#912018">Choose the mode</text>
    <text x="695" y="428" text-anchor="middle" font-size="20" font-weight="700" fill="#912018">the question uses.</text>
  </g>
</svg>
